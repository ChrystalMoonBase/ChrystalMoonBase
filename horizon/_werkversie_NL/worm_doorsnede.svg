<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3530"/>
      <stop offset="1" stop-color="#211d19"/>
    </linearGradient>
    <linearGradient id="glassW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd7e8"/>
      <stop offset="1" stop-color="#5fa9c4"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd24a"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff5a2a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdd3d8"/>
      <stop offset="1" stop-color="#9aa3ab"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#222"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="620" fill="#f4f1ea"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#222">CMB HORIZON — Tunnel-worm (doorsnede)</text>
  <text x="40" y="72" font-size="14" fill="#665e54">Smelt-boren · twee zones · kabel-leg in glazen koker · 1/6 g · vacuüm — SPECULATIEF</text>

  <!-- rock mass -->
  <rect x="40" y="110" width="1020" height="380" fill="url(#rock)" rx="6"/>

  <!-- direction of travel -->
  <line x1="120" y1="95" x2="1000" y2="95" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="89" font-size="13" fill="#222" font-weight="600">graafrichting →</text>

  <!-- ===== ZONE BANDS ===== -->
  <!-- front work zone -->
  <rect x="760" y="110" width="300" height="380" fill="#ff7a2e" opacity="0.10"/>
  <text x="775" y="135" font-size="14" font-weight="700" fill="#c14a16">VOORKANT — werkzone</text>
  <text x="775" y="154" font-size="11.5" fill="#9c4416">smelten + grip · mag RUW zijn</text>
  <!-- cooling zone -->
  <rect x="420" y="110" width="340" height="380" fill="#8a7fb0" opacity="0.10"/>
  <text x="436" y="135" font-size="14" font-weight="700" fill="#5b4f86">MIDDEN — koel/hitteschild</text>
  <text x="436" y="154" font-size="11.5" fill="#6b5f96">glas stolt + koelt af</text>
  <!-- rear koker zone -->
  <rect x="40" y="110" width="380" height="380" fill="#4aa3c4" opacity="0.12"/>
  <text x="56" y="135" font-size="14" font-weight="700" fill="#2c6a85">ACHTERKANT — kokerzone</text>
  <text x="56" y="154" font-size="11.5" fill="#2c6a85">gladde glazen koker · kabel los erin</text>

  <!-- glass tube walls (rear) -->
  <rect x="40" y="250" width="720" height="26" fill="url(#glassW)"/>
  <rect x="40" y="324" width="720" height="26" fill="url(#glassW)"/>
  <text x="60" y="243" font-size="11" fill="#2c6a85">gegloeid regolietglas (taai, spanningsarm — maar bros van karakter)</text>

  <!-- cable lying loose in koker -->
  <rect x="40" y="292" width="700" height="16" rx="8" fill="#d9a441"/>
  <rect x="40" y="296" width="700" height="8" rx="4" fill="#c98f2e"/>
  <text x="120" y="332" font-size="11.5" fill="#7a5a14">aluminium kern (uit MRE/anorthiet) + dunne glas/keramiek-mantel</text>
  <text x="120" y="346" font-size="11" fill="#8a6a24">— ligt LOS in ruime koker → vervangbaar, plakt niet vast (MoS₂ optioneel)</text>

  <!-- ===== WORM BODY ===== -->
  <!-- tail (cable feed) -->
  <rect x="430" y="278" width="350" height="64" rx="20" fill="url(#body)" stroke="#7c858d" stroke-width="2"/>
  <!-- heat shield band -->
  <rect x="690" y="272" width="22" height="76" fill="#5b4f86"/>
  <text x="701" y="372" font-size="10.5" fill="#5b4f86" text-anchor="middle">hitteschild</text>

  <!-- grip wheels / clamps (front-ish, on already-solid glass) -->
  <g fill="#3a3f44" stroke="#1d2024" stroke-width="1.5">
    <circle cx="470" cy="270" r="13"/><circle cx="520" cy="270" r="13"/><circle cx="570" cy="270" r="13"/>
    <circle cx="470" cy="350" r="13"/><circle cx="520" cy="350" r="13"/><circle cx="570" cy="350" r="13"/>
  </g>
  <!-- spikes hint -->
  <g stroke="#1d2024" stroke-width="1.5">
    <line x1="470" y1="257" x2="470" y2="250"/><line x1="520" y1="257" x2="520" y2="250"/><line x1="570" y1="257" x2="570" y2="250"/>
    <line x1="470" y1="363" x2="470" y2="370"/><line x1="520" y1="363" x2="520" y2="370"/><line x1="570" y1="363" x2="570" y2="370"/>
  </g>
  <text x="520" y="402" font-size="11.5" fill="#222" text-anchor="middle" font-weight="600">grip: peristaltisch klemmen / WC-spikes</text>
  <text x="520" y="417" font-size="10.5" fill="#555" text-anchor="middle">zet zich ZIJWAARTS af tegen wand → zwaartekracht-onafhankelijk (1/6 g)</text>

  <!-- melt head (front) -->
  <path d="M780,268 q70,0 70,32 q0,32 -70,32 Z" fill="url(#hot)" stroke="#d24a16" stroke-width="2"/>
  <text x="812" y="276" font-size="11.5" fill="#b53d12" font-weight="700">smeltkop</text>
  <text x="812" y="356" font-size="10.5" fill="#b53d12">laser/verhitter</text>
  <text x="812" y="370" font-size="10.5" fill="#b53d12">~1200–1600 °C</text>

  <!-- molten regolith being pushed aside -->
  <path d="M850,300 q40,-26 70,-30" stroke="#ff8a3d" stroke-width="4" fill="none"/>
  <path d="M850,316 q40,26 70,30" stroke="#ff8a3d" stroke-width="4" fill="none"/>
  <text x="905" y="250" font-size="10.5" fill="#c14a16">smelt → opzij → wordt wand</text>

  <!-- cable coming from factory (left, off screen) -->
  <line x1="40" y1="300" x2="430" y2="300" stroke="#d9a441" stroke-width="7"/>
  <text x="50" y="470" font-size="12" fill="#222">← uit kabelfabriek (continu): geen spoel in worm; fabriek duwt na, gelegd deel ligt STIL</text>

  <!-- diameter callout -->
  <line x1="980" y1="268" x2="980" y2="332" stroke="#222" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="992" y="304" font-size="12" fill="#222" font-weight="700">Ø ~3–5 cm</text>
  <text x="992" y="320" font-size="10" fill="#555">kritisch:</text>
  <text x="992" y="333" font-size="10" fill="#555">smelt-energie ∝ Ø²</text>

  <!-- bottom notes -->
  <rect x="40" y="508" width="1020" height="92" rx="8" fill="#ffffff" stroke="#ddd6cc"/>
  <text x="56" y="532" font-size="13" font-weight="700" fill="#222">Drie problemen lossen elkaar op:</text>
  <text x="56" y="553" font-size="12" fill="#333">① vooruitkomen → zijwaarts klemmen (geen gewicht nodig)   ② afvoer → smelten (smelt wordt wand, geen spoil)   ③ kracht → traag (weinig kracht per stap)</text>
  <text x="56" y="575" font-size="12" fill="#333">Lengte VRIJ (hitte-scheiding + meer grip = meer trekkracht) · Diameter KRITISCH (∝ energie) · Oriëntatie: IMU + kabel-navelstreng + Pods als bakens</text>
  <text x="56" y="592" font-size="11" fill="#8a3b3b">Niet opgelost door dit alles: 130 kW laser over 100 km (diffractie = natuurwet). Dit concept VERVANGT die met fysieke koker — speculatief, categorie 3.</text>
</svg>
