<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2c8fb0"/></marker></defs>
  <rect x="0" y="0" width="1100" height="680" fill="#f4f1ea"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#222">CMB HORIZON — Electrical / build-up schematic</text>
  <text x="40" y="72" font-size="14" fill="#665e54">Cable build-up (ISRU) · voltage&#8596;thickness · Pod-to-Pod communication line — SPECULATIVE</text>
  <text x="40" y="118" font-size="16" font-weight="700" fill="#222">A · Cable cross-section (concentric, all from regolith)</text>
  <g transform="translate(190,250)">
    <circle r="120" fill="#cdd3d8" stroke="#9aa3ab" stroke-width="1"/>
    <circle r="92" fill="#9fd7e8" stroke="#5fa9c4" stroke-width="1"/>
    <circle r="58" fill="#d9a441" stroke="#b9862c" stroke-width="1"/></g>
  <g font-size="12" fill="#222">
    <line x1="248" y1="250" x2="430" y2="200" stroke="#888"/><text x="436" y="204" font-weight="700">Core — ALUMINIUM</text><text x="436" y="220" fill="#555" font-size="11">from anorthite via MRE (Fe&#8594;Si&#8594;Al, &gt;1600C)</text>
    <line x1="270" y1="200" x2="430" y2="252" stroke="#888"/><text x="436" y="256" font-weight="700" fill="#2c6a85">Insulation — REGOLITH GLASS / glass fibre</text><text x="436" y="272" fill="#555" font-size="11">low dielectric constant, high dielectric strength</text>
    <line x1="296" y1="300" x2="430" y2="316" stroke="#888"/><text x="436" y="320" font-weight="700" fill="#5b5147">Jacket (option) — ANORTHITE/ALUMINA ceramic</text><text x="436" y="336" fill="#555" font-size="11">only where needed; often redundant in vacuum conduit</text></g>
  <text x="60" y="400" font-size="11" fill="#8a3b3b">NO rubber/heat-shrink (organic, degrades under UV/radiation, brittle in cold, non-ISRU)</text>
  <text x="600" y="118" font-size="16" font-weight="700" fill="#222">B · Voltage decides thickness (500 kW, silver ref.)</text>
  <text x="600" y="140" font-size="12" fill="#444">P = U &#183; I  &#8594;  high voltage = low current = thin wire</text>
  <g font-size="12">
    <rect x="600" y="158" width="460" height="30" fill="#efe8db"/>
    <text x="612" y="178" font-weight="700">48 V</text><text x="700" y="178">10,400 A</text><text x="820" y="178">~2000 mm&#178;</text>
    <rect x="930" y="164" width="50" height="18" rx="4" fill="#c0563a"/><text x="985" y="178" fill="#c0563a" font-weight="700">~5 cm</text>
    <rect x="600" y="192" width="460" height="30" fill="#f6f1e6"/>
    <text x="612" y="212" font-weight="700">1,000 V</text><text x="700" y="212">500 A</text><text x="820" y="212">~95-120 mm&#178;</text>
    <rect x="945" y="198" width="20" height="18" rx="4" fill="#d59b2e"/><text x="985" y="212" fill="#a9791f" font-weight="700">~1.1 cm</text>
    <rect x="600" y="226" width="460" height="30" fill="#eef4ee"/>
    <text x="612" y="246" font-weight="700">10,000 V</text><text x="700" y="246">50 A</text><text x="820" y="246">~10 mm&#178;</text>
    <rect x="951" y="232" width="8" height="18" rx="3" fill="#3f8f4a"/><text x="985" y="246" fill="#2f7a3a" font-weight="700">~3.5 mm</text></g>
  <text x="600" y="284" font-size="11.5" fill="#2c6a85">&#8594; Thickness was never the problem. Within a Pod / short distance: mm to ~cm suffices.</text>
  <text x="600" y="302" font-size="11.5" fill="#8a3b3b">&#8594; 100 km thinnest silver wire &#8776; 10.5 t; 1 kV variant &#8776; 105 t &#8594; rocket can't do this (make locally).</text>
  <text x="40" y="440" font-size="16" font-weight="700" fill="#222">C · Pod-to-Pod line (mesh) — carries COMMUNICATION, not energy</text>
  <rect x="70" y="470" width="180" height="150" rx="10" fill="#fff" stroke="#a9791f" stroke-width="2"/>
  <text x="160" y="494" font-size="14" font-weight="700" fill="#5a3f10" text-anchor="middle">POD 1 (independent)</text>
  <rect x="92" y="508" width="60" height="34" rx="5" fill="#ffe9a8" stroke="#a9791f"/><text x="122" y="529" font-size="10.5" text-anchor="middle">sun+storage</text>
  <rect x="168" y="508" width="60" height="34" rx="5" fill="#dbe9f2" stroke="#5fa9c4"/><text x="198" y="524" font-size="10.5" text-anchor="middle">compute</text><text x="198" y="536" font-size="10.5" text-anchor="middle">/ coord.</text>
  <rect x="92" y="556" width="136" height="30" rx="5" fill="#e7e2d6" stroke="#b3a994"/><text x="160" y="576" font-size="10.5" text-anchor="middle">modem / transceiver</text>
  <text x="160" y="606" font-size="10" fill="#666" text-anchor="middle">own energy — nothing shared</text>
  <rect x="850" y="470" width="180" height="150" rx="10" fill="#fff" stroke="#a9791f" stroke-width="2"/>
  <text x="940" y="494" font-size="14" font-weight="700" fill="#5a3f10" text-anchor="middle">POD 2 (independent)</text>
  <rect x="872" y="508" width="60" height="34" rx="5" fill="#ffe9a8" stroke="#a9791f"/><text x="902" y="529" font-size="10.5" text-anchor="middle">sun+storage</text>
  <rect x="948" y="508" width="60" height="34" rx="5" fill="#dbe9f2" stroke="#5fa9c4"/><text x="978" y="524" font-size="10.5" text-anchor="middle">compute</text><text x="978" y="536" font-size="10.5" text-anchor="middle">/ coord.</text>
  <rect x="872" y="556" width="136" height="30" rx="5" fill="#e7e2d6" stroke="#b3a994"/><text x="940" y="576" font-size="10.5" text-anchor="middle">modem / transceiver</text>
  <text x="940" y="606" font-size="10" fill="#666" text-anchor="middle">own energy — nothing shared</text>
  <rect x="250" y="540" width="600" height="26" fill="#9fd7e8" opacity="0.6"/>
  <rect x="250" y="546" width="600" height="14" rx="7" fill="#d9a441"/>
  <text x="550" y="534" font-size="11.5" fill="#2c6a85" text-anchor="middle">underground glass conduit (by melt-mole) — cable loose inside</text>
  <text x="550" y="588" font-size="11" fill="#7a5a14" text-anchor="middle">thin data cable (signal) &#8594; mole can be thin, little melt energy (&#216;&#178; !)</text>
  <g stroke="#2c8fb0" stroke-width="2" fill="none"><path d="M250,520 q300,-30 600,0" marker-end="url(#a2)"/></g>
  <text x="550" y="510" font-size="11" fill="#2c8fb0" text-anchor="middle">"Peak 1 in shadow &#8594; Peak 2 takes over computation/control"  &#8644;</text>
  <text x="40" y="660" font-size="11" fill="#665e54">Robust: mesh reroute on break · Maintenance: pull old cable, feed fresh via existing conduit (duct principle) · doesn't stick (slow + loose + MoS2).</text>
</svg>
