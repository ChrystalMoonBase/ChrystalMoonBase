# ============================================================
# CMB8LF v1 — KLIPPER CONFIG
# Voron 2.4 · Phaetus Rapido HF 2 UHF · PC Space Grade
# Board: BTT Manta M8P of BTT Octopus Pro
# ============================================================
# GEBRUIK:
#   Voeg toe aan printer.cfg:
#   [include CMB8LF_v1_klipper_config.cfg]
# ============================================================

# ── PRINTER LIMIETEN ─────────────────────────────────────────
[printer]
kinematics: corexy
max_velocity: 350
max_accel: 4000           # verlaag naar 2000 bij grote prints
max_z_velocity: 20
max_z_accel: 300
square_corner_velocity: 5

# ── EXTRUDER — RAPIDO HF 2 UHF ───────────────────────────────
[extruder]
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 200
max_extrude_cross_section: 50    # UHF = hoge flow · ruimer instellen

# PC Space Grade print temperaturen
control: pid
# PID kalibreren: PID_CALIBRATE HEATER=extruder TARGET=400
# Onderstaande waarden zijn startpunten · kalibreer zelf!
pid_Kp: 26.213
pid_Ki: 1.304
pid_Kd: 131.721

# Rapido HF 2 UHF temperatuur limieten
min_temp: 0
max_temp: 500              # UHF versie haalt 500°C
min_extrude_temp: 180

# ── HOTEND VENTILATOR ─────────────────────────────────────────
# Rapido HF 2 UHF: hotend fan altijd aan boven 50°C
[heater_fan hotend_fan]
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

# ── VERWARMDE KAMER ───────────────────────────────────────────
# PC Space Grade vereist ~60°C kamertemperatuur
# Voeg temperatuursensor toe aan kamer
[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PF5            # pas aan naar jouw pinout

# Optioneel: kamer verwarming via extra heater
# [heater_generic chamber_heater]
# heater_pin: PA3
# sensor_type: Generic 3950
# sensor_pin: PF6
# control: pid
# pid_Kp: 10
# pid_Ki: 1
# pid_Kd: 100
# min_temp: 0
# max_temp: 100

# ── PRINT BED ─────────────────────────────────────────────────
[heater_bed]
min_temp: 0
max_temp: 130              # 110°C voor PC Space Grade
control: pid
# PID kalibreren: PID_CALIBRATE HEATER=heater_bed TARGET=110
pid_Kp: 47.878
pid_Ki: 1.952
pid_Kd: 293.577

# ── PC SPACE GRADE PRINT MACRO ───────────────────────────────
[gcode_macro PRINT_START_PC_SPACEGRADE]
description: Start macro voor Prusament PC Space Grade Black
gcode:
    {% set BED_TEMP = params.BED|default(110)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(400)|float %}
    {% set CHAMBER_TARGET = 60 %}

    M117 CMB8LF v1 - PC Space Grade
    STATUS_HEATING

    # Bed opwarmen
    M190 S{BED_TEMP}
    M117 Bed op temp - kamer opwarmen...

    # Wacht tot kamer 55°C+ is (optioneel · verwijder als geen sensor)
    # TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={CHAMBER_TARGET - 5}

    # Hotend opwarmen
    M109 S{EXTRUDER_TEMP}
    M117 Rapido HF 2 UHF op 400C

    # Home + bed level
    G28
    QUAD_GANTRY_LEVEL
    G28 Z
    BED_MESH_CALIBRATE

    # Purge line
    G92 E0
    G1 X5 Y5 Z0.3 F5000
    G1 X100 E15 F1500
    G1 Z2 F3000
    G92 E0

    M117 CMB8LF v1 - Printing...
    STATUS_PRINTING

[gcode_macro PRINT_END_PC_SPACEGRADE]
description: Einde macro · laat kamer langzaam afkoelen
gcode:
    # Retract + move away
    G91
    G1 E-5 F3600
    G1 Z10 F3000
    G90
    G1 X175 Y350 F10000

    # Schakel heaters uit · NIET abrupt afkoelen
    # PC Space Grade: langzame afkoeling voorkomt warping
    M104 S0         # extruder uit
    # Bed geleidelijk verlagen (optioneel)
    # M190 S80      # wacht op 80°C
    # M190 S60      # wacht op 60°C
    M140 S0         # bed uit

    # Fan geleidelijk uit
    M106 S128       # 50% fan
    G4 P30000       # 30 seconden wachten
    M106 S0         # fan uit

    M84             # motoren uit
    M117 Print klaar - langzaam afkoelen

# ── FILAMENT MACRO's ──────────────────────────────────────────
[gcode_macro LOAD_PC_SPACEGRADE]
description: Laad Prusament PC Space Grade
gcode:
    M109 S400
    M117 Laden PC Space Grade...
    G91
    G1 E80 F300
    G1 E30 F150
    G90
    M117 Klaar

[gcode_macro UNLOAD_PC_SPACEGRADE]
description: Verwijder Prusament PC Space Grade
gcode:
    M109 S400
    M117 Verwijderen...
    G91
    G1 E5 F300
    G1 E-100 F600
    G90
    M117 Klaar

# ── PRESSURE ADVANCE — PC SPACE GRADE ─────────────────────────
# Kalibreer zelf via: TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE
# Startwaarde voor 0.4mm nozzle + Rapido HF 2 UHF:
[extruder]
pressure_advance: 0.035       # startwaarde · kalibreer!
pressure_advance_smooth_time: 0.040

# ── INPUT SHAPER ──────────────────────────────────────────────
# Voer SHAPER_CALIBRATE uit na assemblagemontage
# [input_shaper]
# shaper_freq_x: 58.4         # vervang met eigen kalibratie
# shaper_freq_y: 42.1
# shaper_type: mzv

# ── TIPS VOOR PC SPACE GRADE ──────────────────────────────────
# 1. Eerste laag: 0.3mm · 15mm/s · 115% flow
# 2. Gesloten behuizing VERPLICHT · min 55°C kamer
# 3. Bed: PEI + lichtlaag lijmstift of Magigoo PC
# 4. Koeling: volledig UIT tijdens print
# 5. Na print: niet direct openen · 30 min afkoelen in kamer
# 6. Bake-out: 85°C oven · 48h voor vacuum gebruik
# 7. PA kalibreren op 400°C · koelere temp = andere waarde
# ============================================================
