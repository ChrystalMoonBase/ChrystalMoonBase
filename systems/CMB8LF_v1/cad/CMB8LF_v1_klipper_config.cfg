# ============================================================
# CMB8LF v1 — klipper_config.cfg
# Voron 2.4 + Phaetus Rapido HF 2 UHF
# PEEK-CF Print Instellingen
# CC0 · Chrystal Moon Base · 2026
# ============================================================
# WAARSCHUWING: PEEK vereist volle beschermingsmiddelen
# Dampen zijn schadelijk — zorg voor goede ventilatie
# Nozzle 400°C+ — brandgevaar — nooit zonder toezicht
# ============================================================

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 2000
max_z_velocity: 15
max_z_accel: 350

[extruder]
# Phaetus Rapido HF 2 UHF — max 500°C
nozzle_diameter: 0.400
filament_diameter: 1.750
# PEEK-CF instellingen
control: pid
pid_kp: 28.5
pid_ki: 1.2
pid_kd: 170

[heater_bed]
# PEI vlak + Magigoo PC
control: pid
pid_kp: 68.0
pid_ki: 1.4
pid_kd: 820

# ── PEEK-CF PROFIEL ───────────────────────────────────────────
# Nozzle:    400°C (minimum) — gebruik 410°C voor zekerheid
# Bed:       110°C (Magigoo PC voor adhesie)
# Chamber:   min 55°C — liefst 80-100°C (PEEK crystallisatie)
# Fan:       UIT tijdens print (thermische scheur risico)
# Snelheid:  max 40mm/s (PEEK vloeit langzamer)
# Laagdikte: 0.15mm detail · 0.20mm structureel
# Infill:    Gyroid 40% (sterkte/gewicht optimaal)

[gcode_macro PEEK_CF_START]
gcode:
    M140 S110          ; bed temp
    M104 S410          ; nozzle temp
    M190 S110          ; wacht op bed
    M109 S410          ; wacht op nozzle
    M106 S0            ; ventilator UIT — cruciaal voor PEEK
    G28                ; home
    G1 Z5 F5000
    G1 X10 Y10 F3000
    G1 Z0.2 F1000
    ; Purge lijn
    G1 X100 Y10 E15 F800
    G92 E0

[gcode_macro PEEK_CF_END]
gcode:
    M104 S0            ; nozzle uit
    M140 S80           ; bed langzaam afkoelen (geen shock)
    G91
    G1 Z10 F3000
    G90
    G1 X0 Y300 F5000
    ; Laat langzaam afkoelen — minimaal 30 minuten
    ; Verwijder onderdeel PAS als bed onder 40°C is

# ── MATERIAAL NOTEN ───────────────────────────────────────────
# PEEK-CF outgassing: TML < 0.1% (Kimya / 3DXTech)
# Eerste laag adhesie: Magigoo PC op PEI, bed 110°C
# Krimping: ~1.2% — compenseer in CAD (schaal ×1.012)
# Na print: laat in gesloten printer afkoelen (min 1 uur)
# Vacuüm test: print is geschikt na >48u stabilisatie
