<defs>
  <style>
    text{font-family:'Courier New',Courier,monospace}
    .title{font-size:38px;font-weight:700;fill:#c8e8ff;letter-spacing:4px}
    .sub{font-size:14px;fill:#2a4a6a;letter-spacing:1px}
    .lbl{font-size:12px;font-weight:700;fill:#ddeeff}
    .sm{font-size:10px;fill:#557799}
    .zone{font-size:11px;font-weight:700}
    .note{font-size:9px;fill:#445566}
    .code{font-size:8px;fill:#558877;font-family:Courier New}
  </style>
  <filter id="glow_red" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow_soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow_body" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="belly_glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#cc0000" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#cc0000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="hex" width="60" height="52" patternUnits="userSpaceOnUse">
    <polygon points="15,0 45,0 60,26 45,52 15,52 0,26"
             fill="none" stroke="#0c1a2a" stroke-width="0.8"/>
  </pattern>
</defs>

