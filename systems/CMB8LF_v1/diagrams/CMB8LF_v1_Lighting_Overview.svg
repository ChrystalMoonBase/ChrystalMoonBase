<text x="360" y="1202" class="lbl" style="fill:#cc6655">KLEUR</text>
<text x="360" y="1218" class="sm">RGB(180, 0, 0) — diep rood</text>
<text x="360" y="1232" class="sm">Nooit wit · nooit blauw · nooit oranje</text>

<text x="560" y="1202" class="lbl" style="fill:#cc6655">HELDERHEID</text>
<text x="560" y="1218" class="sm">Basis:  3%  (nooit volledig uit)</text>
<text x="560" y="1232" class="sm">Piek:  18%  (niet feller)</text>
<text x="560" y="1246" class="sm">Periode: 5 seconden per ademhaling</text>

<text x="800" y="1202" class="lbl" style="fill:#cc6655">DIFFUSER</text>
<text x="800" y="1218" class="sm">PEBA Shore 85 naturel/translucent</text>
<text x="800" y="1232" class="sm">Achter bestaande armor ventslots</text>
<text x="800" y="1246" class="sm">Geen harde LED-punten zichtbaar</text>

<text x="1050" y="1202" class="lbl" style="fill:#cc6655">CHAIN</text>
<text x="1050" y="1218" class="sm">54× WS2812B op 1 datakabel</text>
<text x="1050" y="1232" class="sm">Pico W #1 · GP14 · 5V rail</text>
<text x="1050" y="1246" class="sm">330Ω series · 100µF cap op 5V</text>

<line x1="310" y1="1262" x2="1370" y2="1262" stroke="#220000" stroke-width="0.5"/>
<text x="360" y="1282" class="lbl" style="fill:#cc6655">FIRMWARE (CircuitPython)</text>
<text x="360" y="1298" class="code">import board, neopixel, math, time</text>
<text x="360" y="1312" class="code">pixels = neopixel.NeoPixel(board.GP14, 54, auto_write=False)</text>
<text x="360" y="1326" class="code">BASE, PEAK, PERIOD = 0.03, 0.18, 5.0</text>
<text x="360" y="1340" class="code">t = 0.0</text>
<text x="360" y="1354" class="code">while True:</text>
<text x="400" y="1368" class="code">b = BASE + (PEAK-BASE) * (math.sin(2*math.pi*t/PERIOD)+1)/2</text>
<text x="400" y="1382" class="code">pixels.fill((int(180*b), 0, 0))  ;  pixels.show()</text>
<text x="400" y="1396" class="code">t += 0.05  ;  time.sleep(0.05)</text>


